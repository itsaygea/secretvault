# CI integration overlay for SecretVault.
#
# Replaces the previous health-only Supabase mock with a real PostgreSQL +
# PostgREST stack so the application exercises the same grant/RLS/PostgREST
# exposure path it relies on in production (SV-029). Migrations run against
# real Postgres as a one-shot; runtime queries flow through real PostgREST
# as service_role.
#
# Startup order: postgres -> migrate (one-shot) -> postgrest -> secretvault-mcp
#
# Merged on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f ci/docker-compose.ci.yml ...
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ci-password
      POSTGRES_DB: postgres
    volumes:
      - ./ci/postgres-init.sql:/docker-entrypoint-initdb.d/001-secretvault.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  # One-shot: apply all migrations to the real database before PostgREST loads
  # the schema. PostgREST caches the schema at startup, so the tables must
  # already exist when it first connects.
  migrate:
    image: node:22-alpine
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SECRETVAULT_DATABASE_URL: "postgresql://postgres:ci-password@postgres:5432/postgres"
      SECRETVAULT_DATABASE_SSL: "false"
    volumes:
      # Built artifacts + migration sources are enough to run the migration
      # binary without starting the HTTP server.
      - ./packages/mcp-server/dist:/app/packages/mcp-server/dist:ro
      - ./packages/shared/dist:/app/packages/shared/dist:ro
      - ./packages/mcp-server/package.json:/app/packages/mcp-server/package.json:ro
      - ./packages/shared/package.json:/app/packages/shared/package.json:ro
      - ./package.json:/app/package.json:ro
      - ./supabase/migrations:/app/supabase/migrations:ro
      - ./node_modules:/app/node_modules:ro
    command: ["node", "/app/packages/mcp-server/dist/migrate.js"]

  postgrest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: "postgres://authenticator:ci-authenticator@postgres:5432/postgres"
      PGRST_DB_SCHEMAS: "secretvault"
      PGRST_DB_ANON_ROLE: "anon"
      PGRST_JWT_SECRET: "ci-postgrest-jwt-secret-do-not-use-in-production"
      # Legacy GUCs ON: PostgREST populates request.jwt.claim.role, which the
      # auth.role() function and every 001 RLS policy read. (v12 defaults to
      # the new request.jwt.claims JSON GUC, which auth.role() does not see.)
      PGRST_DB_USE_LEGACY_GUCS: "true"
      PGRST_SERVER_PORT: "3000"
      PGRST_LOG_LEVEL: "info"
    # The postgrest image is distroless (no shell), so an in-container
    # healthcheck is impossible. Readiness is verified from the host by the
    # CI workflow (curl + ci/postgrest-permissions.mjs) before the app is
    # exercised; the migrate one-shot guarantees the schema already exists.

  # @supabase/supabase-js calls /rest/v1/<table>; standalone PostgREST serves
  # /<table>. This nginx proxy rewrites the prefix, mirroring the route Kong
  # adds in real self-hosted Supabase. CI-only.
  postgrest-proxy:
    image: nginx:1.27-alpine
    depends_on:
      - postgrest
    volumes:
      - ./ci/postgrest-proxy.conf:/etc/nginx/nginx.conf:ro
    ports:
      # Host-only mapping so the CI runner can assert the permission matrix.
      - "127.0.0.1:3001:8000"

  secretvault-mcp:
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      postgrest:
        condition: service_started
      postgrest-proxy:
        condition: service_started
