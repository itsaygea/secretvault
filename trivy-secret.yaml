# Trivy secret-scanning allow rules for SecretVault.
#
# The security workflow gates on ANY secret finding (exit-code 1, all
# severities). Entries here are path-scoped false-positive allowances — each
# must reference why the "secret" is intentionally committed. Do not add
# real credentials to this repo; if a rule here ever covers something that is
# not a deterministic test fixture, delete the rule and rotate the credential.
#
# Trivy auto-loads this file from the scan root (trivy-secret.yaml); the
# workflow's secret step (fs scan of ".") runs with the workspace as cwd.

allow-rules:
  # ci/secretvault.env carries a deterministic HS256 service_role JWT minted
  # by ci/mint-jwt.mjs from the CI-only PGRST_JWT_SECRET. It is valid solely
  # for the throwaway CI PostgREST (container-internal network, localhost
  # bindings, destroyed after the run) and securityGate.test.ts asserts it
  # matches the mint script verbatim. It is a test fixture, not a credential.
  - id: allow-ci-fixture-service-jwt
    description: >
      Deterministic CI-only JWT fixture in ci/secretvault.env (see file header
      and ci/mint-jwt.mjs); grants nothing outside the ephemeral CI stack.
    path: ^ci/secretvault\.env$
