# Bundled reverse proxy so @supabase/supabase-js (which calls /rest/v1/<table>)
# can talk to standalone PostgREST (which serves /<table>). Mirrors the route
# Kong adds in real self-hosted Supabase, identical to ci/postgrest-proxy.conf
# but shipped for the 1-click bundled stack (#94).
#
# Bundled-only: loaded by the `postgrest-proxy` nginx service in
# docker-compose.bundled.yml. External/Supabase/managed-PostgreSQL deployments
# never start this service.

events {
  worker_connections 64;
}

http {
  server {
    listen 8000;

    location /rest/v1/ {
      proxy_pass http://postgrest:3000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PostgREST root (OpenAPI) is served under /rest/v1 as well for clients
    # that probe it; everything else passes through unchanged.
    location / {
      proxy_pass http://postgrest:3000;
      proxy_set_header Host $host;
    }
  }
}
