services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SECRETVAULT_DOMAIN=${SECRETVAULT_DOMAIN:-vault.local}
      - SECRETVAULT_ACME_EMAIL=${SECRETVAULT_ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      secretvault-mcp:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
