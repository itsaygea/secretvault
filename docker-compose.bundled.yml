# Bundled PostgreSQL + PostgREST overlay for SecretVault (#93, #94).
#
# Adds a self-contained postgres:16-alpine + postgrest:v12.2.3 stack so
# SecretVault can run with zero external infrastructure: startup database
# migrations run against the local Postgres, and runtime API queries flow
# through local PostgREST exactly as they would against Supabase Cloud. This
# mirrors the ci/docker-compose.ci.yml architecture (SV-029) so the same
# grant/RLS/PostgREST exposure path is exercised in 1-click bundled mode.
#
# Startup order: postgres -> migrate (one-shot) -> postgrest -> postgrest-proxy
#                -> secretvault-mcp
#
# Merged on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.bundled.yml up -d
#
# The bundled container has NO TLS, so SECRETVAULT_DATABASE_SSL=false is set on
# the SecretVault + migrate services (the migration runner defaults TLS ON with
# verification — that must be relaxed for the plaintext local socket).
# External / Supabase / managed-PostgreSQL deployments continue to use
# docker-compose.yml alone with their own SECRETVAULT_DATABASE_URL; this
# overlay changes nothing for them.
#
# Credentials are read from .env so install-server.sh (#94) can inject strong,
# randomly generated values. Defaults are provided only so `docker compose
# config` is usable in tests — override them in production.
services:
  postgres:
    image: postgres:16-alpine
    container_name: secretvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secretvault}
      POSTGRES_USER: ${POSTGRES_USER:-secretvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env / install-server.sh)}
    volumes:
      # Bootstrap PostgREST roles (authenticator/anon/service_role + auth.role())
      # on first boot only. Migrations run afterwards via the `migrate` one-shot.
      - ./bundled/postgres-init.sql:/docker-entrypoint-initdb.d/001-secretvault-roles.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready exits 0 once the server accepts connections. Checking as the
      # POSTGRES_USER confirms the cluster is ready for SecretVault migrations.
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - default

  # One-shot: apply all migrations to the real database before PostgREST loads
  # the schema. PostgREST caches the schema at startup, so the tables must
  # already exist when it first connects. We reuse the bundled app image (which
  # ships migrate.js + the supabase/migrations) but bypass the server
  # entrypoint so the container runs migrations once and exits.
  migrate:
    image: secretvault-mcp:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SECRETVAULT_DATABASE_URL: postgresql://${POSTGRES_USER:-secretvault}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-secretvault}
      SECRETVAULT_DATABASE_SSL: "false"
    # Bypass the app entrypoint (which starts the HTTP server) and run the
    # migration entrypoint directly. restart: "no" so Compose does not loop a
    # failed migration silently — a migration error must be visible.
    restart: "no"
    entrypoint: ["node"]
    command: ["/app/packages/mcp-server/dist/migrate.js"]

  postgrest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:bundled-authenticator@postgres:5432/${POSTGRES_DB:-secretvault}
      PGRST_DB_SCHEMAS: "secretvault"
      PGRST_DB_ANON_ROLE: "anon"
      # Per-install secret generated by install-server.sh. The app's service
      # key (SECRETVAULT_SUPABASE_SERVICE_KEY) is a service_role HS256 JWT
      # signed with this same secret.
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?PGRST_JWT_SECRET must be set (see .env / install-server.sh)}
      # Legacy GUCs ON: PostgREST populates request.jwt.claim.role, which the
      # auth.role() function and every 001 RLS policy read. (v12 defaults to
      # the new request.jwt.claims JSON GUC, which auth.role() does not see.)
      PGRST_DB_USE_LEGACY_GUCS: "true"
      PGRST_SERVER_PORT: "3000"
      PGRST_LOG_LEVEL: "info"
    # The postgrest image is distroless (no shell), so an in-container
    # healthcheck is impossible. Readiness is gated by the migrate one-shot
    # having completed (schema exists) and verified from the host by
    # install-server.sh's /health check against the app.

  # @supabase/supabase-js calls /rest/v1/<table>; standalone PostgREST serves
  # /<table>. This nginx proxy rewrites the prefix, mirroring the route Kong
  # adds in real self-hosted Supabase. Bundled-only.
  postgrest-proxy:
    image: nginx:1.27-alpine
    depends_on:
      - postgrest
    volumes:
      - ./bundled/postgrest-proxy.conf:/etc/nginx/nginx.conf:ro

  secretvault-mcp:
    # Wired to the bundled stack: point the migration runner at the local
    # service and disable TLS (alpine postgres ships plaintext only).
    # SECRETVAULT_SUPABASE_URL targets the nginx proxy so the supabase-js
    # client's /rest/v1/<table> calls reach PostgREST. depends_on gates keep
    # the app from starting before the schema exists and PostgREST is up.
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      postgrest:
        condition: service_started
      postgrest-proxy:
        condition: service_started
    environment:
      SECRETVAULT_DATABASE_URL: postgresql://${POSTGRES_USER:-secretvault}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-secretvault}
      SECRETVAULT_DATABASE_SSL: "false"
      SECRETVAULT_SUPABASE_URL: http://postgrest-proxy:8000
      SECRETVAULT_SUPABASE_SERVICE_KEY: ${SECRETVAULT_SUPABASE_SERVICE_KEY:?SECRETVAULT_SUPABASE_SERVICE_KEY must be set (see .env / install-server.sh)}

volumes:
  postgres_data:
    name: secretvault_postgres_data
