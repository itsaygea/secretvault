name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Run nightly at ~03:17 UTC. Scanner DBs update before the scan.
    # Off-the-hour to spread load; cron cadence is documented in SECURITY.md.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # upload SARIF for GitHub Security code scanning

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-db:
    name: Refresh vulnerability database
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Update Trivy DB
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          exit-code: "0"


  repo-scan:
    name: Scan repository (deps, config, secrets)
    needs: update-db
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          # Full history improves secret-scanning reach-back.
          fetch-depth: 0

      - name: Create reports directory
        run: mkdir -p reports

      # 1. Dependency manifests + lockfile.
      - name: Scan dependency manifests (gate on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: reports/deps.sarif
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # 2. IaC / misconfiguration across repo config.
      - name: Scan configuration / IaC (gate on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          format: sarif
          output: reports/config.sarif
          exit-code: "1"
          severity: CRITICAL,HIGH

      # 3. Hard-coded secrets. Never gated off — a hit must always fail.
      - name: Scan for leaked secrets (gate on any finding)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: sarif
          output: reports/secrets.sarif
          exit-code: "1"
          severity: CRITICAL,HIGH,MEDIUM,LOW

      # 4. SBOM from the source tree (Spdx for manifest breadth).
      - name: Generate SBOM (CycloneDX) from source
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: reports/sbom-source.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-source-cyclonedx
          path: reports/sbom-source.cdx.json
          if-no-files-found: error

      - name: Upload dependency SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.30.0
        with:
          sarif_file: reports/deps.sarif
          category: trivy-dependencies

      - name: Upload config SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.30.0
        with:
          sarif_file: reports/config.sarif
          category: trivy-config

      - name: Upload secrets SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.30.0
        with:
          sarif_file: reports/secrets.sarif
          category: trivy-secrets

  gate-fixture:
    name: Prove a gated vulnerability fails CI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Run gate policy self-test
        run: node scripts/test-trivy-gate.mjs
